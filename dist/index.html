    <!-- Pre-Flight: Storage Guard, Theme Pre-Paint & Silent Auto-Healing -->
    <script>
      (function() {
        // 1. Safe Theme & Locale Pre-Paint (Cookies -> LocalStorage -> Device Default)
        try {
          function getCookieVal(key) {
            if (!document.cookie) return null;
            var pairs = document.cookie.split('; ');
            for (var i = 0; i < pairs.length; i++) {
              var parts = pairs[i].split('=');
              if (parts[0] === key) return decodeURIComponent(parts.slice(1).join('='));
            }
            return null;
          }

          // A. Language: Cookie -> LocalStorage -> Device Language
          var effectiveLang = getCookieVal('darc_lang') || localStorage.getItem('darc-locale');
          if (!effectiveLang) {
            var prefsCookie = getCookieVal('darc_prefs');
            if (prefsCookie) {
              try { effectiveLang = JSON.parse(prefsCookie).lang; } catch (e) {}
            }
          }
          if (effectiveLang !== 'ar' && effectiveLang !== 'en') {
            var navLang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
            effectiveLang = navLang.toLowerCase().startsWith('ar') ? 'ar' : 'en';
          }
          document.documentElement.lang = effectiveLang;
          document.documentElement.dir = (effectiveLang === 'ar' ? 'rtl' : 'ltr');

          // B. Theme: Cookie -> LocalStorage -> Device Theme
          var effectiveTheme = getCookieVal('darc_theme') || localStorage.getItem('darc-theme');
          if (!effectiveTheme) {
            var prefsCookie = getCookieVal('darc_prefs');
            if (prefsCookie) {
              try { effectiveTheme = JSON.parse(prefsCookie).theme; } catch (e) {}
            }
          }
          if (effectiveTheme !== 'dark' && effectiveTheme !== 'light') {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              effectiveTheme = 'dark';
            } else {
              effectiveTheme = 'light';
            }
          }
          document.documentElement.dataset.theme = effectiveTheme;
        } catch (e) {}

        // 2. Silent Auto-Healing Boundary for Stale Module Cache
        window.__darc_heal_active = false;
        function triggerAutoHeal(reason) {
          if (window.__darc_heal_active) return;
          var LAST_HEAL_KEY = 'darc_last_heal_ts';
          var now = Date.now();
          var lastHeal = 0;
          try { lastHeal = Number(sessionStorage.getItem(LAST_HEAL_KEY) || 0); } catch (e) {}
          
          // Auto-heal once silently if occurred more than 10 seconds ago
          if (now - lastHeal > 10000) {
            window.__darc_heal_active = true;
            try { sessionStorage.setItem(LAST_HEAL_KEY, String(now)); } catch (e) {}
            console.warn('[DARC Auto-Heal] Stale cache detected (' + reason + '). Purging caches and auto-reloading silently...');
            
            var purgePromises = [];
            if ('caches' in window) {
              purgePromises.push(caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).catch(function() {}));
            }
            if ('serviceWorker' in navigator) {
              purgePromises.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).catch(function() {}));
            }
            try {
              localStorage.removeItem('darc_offline_bootstrap');
              localStorage.removeItem('darc_offline_queue');
            } catch (e) {}

            Promise.all(purgePromises).finally(function() {
              window.location.reload(true);
            });
            return true;
          }
          return false;
        }

        window.addEventListener('error', function(event) {
          var msg = String(event?.message || event?.error?.message || '');
          if (
            msg.indexOf('does not provide an export named') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1
          ) {
            triggerAutoHeal(msg);
          }
        });

        window.addEventListener('unhandledrejection', function(event) {
          var reason = String(event?.reason?.message || event?.reason || '');
          if (
            reason.indexOf('does not provide an export named') !== -1 ||
            reason.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            reason.indexOf('Loading chunk') !== -1
          ) {
            triggerAutoHeal(reason);
          }
        });
      })();
    </script>
