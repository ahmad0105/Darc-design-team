name: Continuous Delivery & Cloudflare Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  test-build-deploy:
    name: Test, Lint, Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd darc-cloud-backend && npm ci

      - name: Run Test Suite
        run: npm run test

      - name: Run Code Style & Architecture Linter
        run: npm run lint

      - name: Build Production Bundle (Vite)
        run: npx vite build

      - name: Deploy to Cloudflare Workers Static Assets
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
