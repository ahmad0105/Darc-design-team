name: Rotate Secrets (Automatic)

on:
  schedule:
    - cron: '0 0 1 */3 *'

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Generate new secrets
        id: gen
        run: |
          echo "SUPABASE_SERVICE_ROLE_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - name: Update Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler secret put SUPABASE_SERVICE_ROLE_KEY ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          wrangler secret put JWT_SECRET ${{ env.JWT_SECRET }}
