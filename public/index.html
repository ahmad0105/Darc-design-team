<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d6269" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DARC Design Team | Architecture & Design Workspace</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%230d6269'/%3E%3Ctext x='50%25' y='67%25' font-size='52' font-family='sans-serif' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=3.8.1" />
    <script>
      (function() {
        try {
          var savedLocale = localStorage.getItem('darc-locale');
          if (savedLocale === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          }
          var savedTheme = localStorage.getItem('darc-theme');
          if (savedTheme) {
            document.documentElement.dataset.theme = savedTheme;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const APP_VERSION = 'v3.8.1';

      try {
        await import(`/app.js?v=${APP_VERSION}`);
      } catch (error) {
        console.error("Critical System Startup Error:", error);

        const errorMsg = String(error?.message || error || 'Unknown startup error');
        const isStaleModuleError = errorMsg.includes('does not provide an export named') || 
                                   errorMsg.includes('Failed to fetch dynamically imported module') ||
                                   errorMsg.includes('SyntaxError');

        // Self-Healing Auto-Recovery: if a stale module cache is detected, clear caches and reload once automatically
        if (isStaleModuleError && !sessionStorage.getItem('darc_auto_heal_tried')) {
          sessionStorage.setItem('darc_auto_heal_tried', 'true');
          console.warn("[DARC Auto-Heal] Stale module cache detected. Purging cache and auto-reloading...");
          if ('caches' in window) {
            try {
              const keys = await caches.keys();
              await Promise.all(keys.map(k => caches.delete(k)));
            } catch (e) {}
          }
          if ('serviceWorker' in navigator) {
            try {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(r => r.unregister()));
            } catch (e) {}
          }
          location.reload(true);
        } else {
          // Render Comprehensive English / Bilingual Diagnostic Screen
          const timestamp = new Date().toISOString();
          const localTime = new Date().toLocaleString();
          const userAgent = navigator.userAgent;
          const currentUrl = window.location.href;
          const isOnline = navigator.onLine ? 'Connected (Online)' : 'Disconnected (Offline)';
          const swActive = navigator.serviceWorker?.controller ? 'Active (Controller Registered)' : 'Inactive';

          const diagnosticReport = {
            application: "DARC Design Team Workspace",
            version: APP_VERSION,
            timestampUtc: timestamp,
            timestampLocal: localTime,
            url: currentUrl,
            errorName: error?.name || 'StartupError',
            errorMessage: errorMsg,
            isStaleCacheError: isStaleModuleError,
            onlineStatus: isOnline,
            serviceWorker: swActive,
            userAgent: userAgent,
            stack: error?.stack || 'No stack trace available'
          };

          window.__DARC_DIAGNOSTICS__ = diagnosticReport;

          document.body.dir = 'ltr';
          document.body.style.margin = '0';
          document.body.style.background = '#0f172a';
          document.body.style.color = '#f8fafc';
          document.body.style.fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";

          document.getElementById('app').innerHTML = `
            <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;">
              <div style="background:#1e293b;border:1px solid #334155;border-radius:16px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);max-width:860px;width:100%;overflow:hidden;">
                
                <!-- Header Banner -->
                <div style="background:linear-gradient(135deg, #0d9488 0%, #0f766e 100%);padding:24px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
                  <div style="display:flex;align-items:center;gap:14px;">
                    <div style="width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:24px;">
                      ⚠️
                    </div>
                    <div>
                      <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;letter-spacing:-0.02em;">
                        Application Boot Diagnostic
                      </h1>
                      <span style="font-size:13px;color:rgba(255,255,255,0.85);font-family:'Cairo',sans-serif;direction:rtl;">
                        تشخيص وفحص إقلاع النظام وحماية الذاكرة المؤقتة
                      </span>
                    </div>
                  </div>
                  <span style="background:rgba(0,0,0,0.25);color:#5eead4;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;font-family:monospace;">
                    ${APP_VERSION}
                  </span>
                </div>

                <!-- Main Content Area -->
                <div style="padding:32px;">
                  
                  <!-- Cause Explanation Card -->
                  <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:18px 20px;margin-bottom:24px;">
                    <div style="display:flex;align-items:flex-start;gap:12px;">
                      <span style="font-size:20px;line-height:1;">🔍</span>
                      <div>
                        <strong style="display:block;font-size:14px;color:#fca5a5;margin-bottom:4px;">
                          ${isStaleModuleError ? 'Root Cause: Stale ES Module Cache Skew' : 'Root Cause: Critical Script Execution Error'}
                        </strong>
                        <p style="margin:0;font-size:13px;color:#cbd5e1;line-height:1.6;">
                          ${isStaleModuleError 
                            ? 'Your browser or Service Worker retained an older cached copy of a module that is missing newly deployed exports. Purging the local cache will immediately resolve this conflict.' 
                            : 'An unhandled exception interrupted the initialization phase. Review the diagnostic breakdown below.'}
                        </p>
                      </div>
                    </div>
                  </div>

                  <!-- Action Buttons -->
                  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;">
                    <button id="btn-force-reload" style="cursor:pointer;background:#0d9488;color:#ffffff;border:none;padding:11px 22px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background 0.15s ease;">
                      🔄 Clear Cache & Force Reload
                    </button>
                    <button id="btn-copy-diag" style="cursor:pointer;background:#334155;color:#f8fafc;border:1px solid #475569;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;">
                      📋 Copy Diagnostics Report
                    </button>
                  </div>

                  <!-- System & Environment Information Table -->
                  <h3 style="margin:0 0 12px 0;font-size:13px;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8;font-weight:700;">
                    Environment & Diagnostic Metadata
                  </h3>
                  <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px 18px;margin-bottom:24px;font-size:12px;font-family:monospace;display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:12px;">
                    <div><span style="color:#64748b;">Timestamp:</span> <span style="color:#e2e8f0;">${localTime}</span></div>
                    <div><span style="color:#64748b;">Network Status:</span> <span style="color:#10b981;">${isOnline}</span></div>
                    <div><span style="color:#64748b;">Service Worker:</span> <span style="color:#e2e8f0;">${swActive}</span></div>
                    <div><span style="color:#64748b;">Error Type:</span> <span style="color:#f87171;">${diagnosticReport.errorName}</span></div>
                    <div style="grid-column: 1 / -1;"><span style="color:#64748b;">URL:</span> <span style="color:#93c5fd;word-break:break-all;">${currentUrl}</span></div>
                  </div>

                  <!-- Error Message & Stack Trace Section -->
                  <h3 style="margin:0 0 12px 0;font-size:13px;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8;font-weight:700;">
                    Exception Details & Stack Trace
                  </h3>
                  <div style="background:#020617;border:1px solid #1e293b;border-radius:10px;padding:16px;overflow-x:auto;">
                    <div style="color:#ef4444;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;margin-bottom:8px;">
                      ${diagnosticReport.errorMessage}
                    </div>
                    <pre style="margin:0;color:#94a3b8;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all;">${diagnosticReport.stack}</pre>
                  </div>

                </div>

                <!-- Footer -->
                <div style="background:#0f172a;border-top:1px solid #334155;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#64748b;">
                  <span>DARC Design Team Engineering System</span>
                  <span>Fault Containment & Recovery v3.8</span>
                </div>

              </div>
            </div>
          `;

          // Hook Action Handlers
          document.getElementById('btn-force-reload')?.addEventListener('click', async () => {
            const btn = document.getElementById('btn-force-reload');
            if (btn) btn.innerText = 'Purging Caches...';
            if ('caches' in window) {
              try {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
              } catch (e) {}
            }
            if ('serviceWorker' in navigator) {
              try {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(r => r.unregister()));
              } catch (e) {}
            }
            try {
              localStorage.removeItem('darc_offline_bootstrap');
              sessionStorage.clear();
            } catch (e) {}
            location.reload(true);
          });

          document.getElementById('btn-copy-diag')?.addEventListener('click', () => {
            const btn = document.getElementById('btn-copy-diag');
            const text = JSON.stringify(window.__DARC_DIAGNOSTICS__, null, 2);
            navigator.clipboard.writeText(text).then(() => {
              if (btn) {
                const prev = btn.innerText;
                btn.innerText = '✅ Copied to Clipboard!';
                setTimeout(() => { btn.innerText = prev; }, 2000);
              }
            }).catch(() => {
              alert(text);
            });
          });
        }
      }
    </script>
  </body>
</html>
