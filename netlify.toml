[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to Cloudflare Workers backend (or backend URL)
# This eliminates CORS issues and third-party cookie blocks completely!
[[redirects]]
  from = "/api/*"
  to = "https://darc-cloud-backend.ahmad-hashmi-c.workers.dev/api/:splat"
  status = 200

# Single Page Application (SPA) routing fallback rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Service Worker should never be cached permanently
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# HTML entry point: validate freshness to avoid stale UI versions
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Content-Hashed Assets: Can be safely cached permanently
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
